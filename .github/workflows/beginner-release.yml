name: Publish beginner downloads

on:
  push:
    branches: [main]
    paths: ['beginner/**', '.github/workflows/beginner-release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore exact OFCOS icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'beginner/desktop/app/assets','beginner/desktop/build','beginner/android/app/src/main/res/drawable' | Out-Null
          $png=[Convert]::FromBase64String((Get-Content 'desktop/app/assets/app-icon.png.b64' -Raw))
          $ico=[Convert]::FromBase64String((Get-Content 'desktop/build/app-icon.ico.b64' -Raw))
          $rcedit=(1..4 | ForEach-Object { Get-Content "desktop/build/rcedit.part$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('beginner/desktop/app/assets/app-icon.png',$png)
          [IO.File]::WriteAllBytes('beginner/desktop/build/app-icon.ico',$ico)
          [IO.File]::WriteAllBytes('beginner/desktop/build/rcedit-x64.exe',[Convert]::FromBase64String($rcedit))
          [IO.File]::WriteAllBytes('beginner/android/app/src/main/res/drawable/app_icon.png',$png)
      - name: Build beginner Windows app
        working-directory: beginner/desktop
        run: npm install && npm run build
      - name: Build beginner Android app
        working-directory: beginner/android
        run: gradle --no-daemon assembleDebug
      - name: Prepare public files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item 'beginner/desktop/dist/생산계산기-초급자용-PC-1.1.0.exe' 'beginner/production-calculator-beginner-PC-1.1.0.exe'
          Copy-Item 'beginner/android/app/build/outputs/apk/debug/app-debug.apk' 'beginner/production-calculator-beginner-Android-1.1.0.apk'
          $android=(1..8 | ForEach-Object { Get-Content "updates/android-v2.0.part$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('beginner/production-calculator-intermediate-Android-2.0.0.apk',[Convert]::FromBase64String($android))
          gh release download v2.1.0 --pattern 'production-calculator-setup-2.1.0.exe' --dir beginner
          Move-Item 'beginner/production-calculator-setup-2.1.0.exe' 'beginner/production-calculator-intermediate-PC-2.1.0.exe'
      - name: Publish unified download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-current
          name: 생산계산기 다운로드 - 중급자용 / 초급자용
          make_latest: false
          body: |
            ## 아래에서 필요한 파일을 누르세요

            ### 중급자용
            - [중급자용 PC(윈도우) 다운로드](https://github.com/tjdduf0525-glitch/ofcos-production-calculator/releases/download/downloads-current/production-calculator-intermediate-PC-2.1.0.exe)
            - [중급자용 갤럭시(안드로이드) 다운로드](https://github.com/tjdduf0525-glitch/ofcos-production-calculator/releases/download/downloads-current/production-calculator-intermediate-Android-2.0.0.apk)

            ### 초급자용
            - [초급자용 PC(윈도우) 다운로드](https://github.com/tjdduf0525-glitch/ofcos-production-calculator/releases/download/downloads-current/production-calculator-beginner-PC-1.1.0.exe)
            - [초급자용 갤럭시(안드로이드) 다운로드](https://github.com/tjdduf0525-glitch/ofcos-production-calculator/releases/download/downloads-current/production-calculator-beginner-Android-1.1.0.apk)

            아래 Assets의 영문 파일 목록과 Source code는 무시하셔도 됩니다.
          files: |
            beginner/production-calculator-intermediate-PC-2.1.0.exe
            beginner/production-calculator-intermediate-Android-2.0.0.apk
            beginner/production-calculator-beginner-PC-1.1.0.exe
            beginner/production-calculator-beginner-Android-1.1.0.apk

