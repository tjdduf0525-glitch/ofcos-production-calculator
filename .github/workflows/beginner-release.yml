name: Publish beginner downloads

on:
  push:
    branches: [main]
    paths: ['beginner/**', '.github/workflows/beginner-release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore exact OFCOS icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'beginner/desktop/app/assets','beginner/desktop/build','beginner/android/app/src/main/res/drawable' | Out-Null
          $png=[Convert]::FromBase64String((Get-Content 'desktop/app/assets/app-icon.png.b64' -Raw))
          $ico=[Convert]::FromBase64String((Get-Content 'desktop/build/app-icon.ico.b64' -Raw))
          $rcedit=(1..4 | ForEach-Object { Get-Content "desktop/build/rcedit.part$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('beginner/desktop/app/assets/app-icon.png',$png)
          [IO.File]::WriteAllBytes('beginner/desktop/build/app-icon.ico',$ico)
          [IO.File]::WriteAllBytes('beginner/desktop/build/rcedit-x64.exe',[Convert]::FromBase64String($rcedit))
          [IO.File]::WriteAllBytes('beginner/android/app/src/main/res/drawable/app_icon.png',$png)
      - name: Build beginner Windows app
        working-directory: beginner/desktop
        run: npm install && npm run build
      - name: Build beginner Android app
        working-directory: beginner/android
        run: gradle --no-daemon assembleDebug
      - name: Prepare public files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item 'beginner/desktop/dist/생산계산기-초급자용-PC-1.0.0.exe' 'beginner/초급자용-생산계산기-PC용.exe'
          Copy-Item 'beginner/android/app/build/outputs/apk/debug/app-debug.apk' 'beginner/초급자용-생산계산기-갤럭시용.apk'
          $android=(1..8 | ForEach-Object { Get-Content "updates/android-v2.0.part$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('beginner/중급자용-생산계산기-갤럭시용.apk',[Convert]::FromBase64String($android))
          gh release download v2.1.0 --pattern 'production-calculator-setup-2.1.0.exe' --dir beginner
          Move-Item 'beginner/production-calculator-setup-2.1.0.exe' 'beginner/중급자용-생산계산기-PC용.exe'
          gh release delete downloads-current --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host '기존 통합 다운로드가 없어 새로 만듭니다.' }
      - name: Publish unified download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-current
          name: 생산계산기 다운로드 - 중급자용 / 초급자용
          make_latest: false
          body: |
            원하는 버전과 기기에 맞는 파일을 받으세요.
            - 중급자용-생산계산기-PC용.exe: 중급자용 Windows
            - 중급자용-생산계산기-갤럭시용.apk: 중급자용 갤럭시/안드로이드
            - 초급자용-생산계산기-PC용.exe: 초급자용 Windows
            - 초급자용-생산계산기-갤럭시용.apk: 초급자용 갤럭시/안드로이드
          files: |
            beginner/중급자용-생산계산기-PC용.exe
            beginner/중급자용-생산계산기-갤럭시용.apk
            beginner/초급자용-생산계산기-PC용.exe
            beginner/초급자용-생산계산기-갤럭시용.apk

