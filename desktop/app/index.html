<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07132f">
  <title>생산 계산기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/app-icon.png">
  <style>
    :root{--navy:#06112c;--navy2:#0d1c43;--white:#fff;--muted:#a9b3ca;--red:#ff6678;--line:rgba(255,255,255,.15);--card:rgba(255,255,255,.07);--good:#71e3bc}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#182757 0,transparent 35%),linear-gradient(145deg,var(--navy),#030918 75%);color:var(--white);font-family:"Malgun Gothic","Noto Sans KR",sans-serif}
    button,input,select{font:inherit}.shell{max-width:900px;margin:auto;padding:20px 18px 44px}.brand{display:flex;align-items:center;gap:14px;margin:8px 0 26px}.brand img{width:64px;height:64px;border-radius:17px}.brand h1{font-family:Georgia,serif;font-size:28px;margin:0;letter-spacing:-1px}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .home-title{font-size:22px;margin:0 0 8px}.hint{color:var(--muted);margin:0 0 20px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.menu button{min-height:96px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:#fff;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.18);transition:.2s}.menu button:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1)}.menu b{display:block;font-size:17px;margin-bottom:7px}.menu span{font-size:12px;color:var(--muted)}
    .page{display:none}.page.active{display:block}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back,.action-btn{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.topbar h2{margin:0;font-size:21px}.top-actions{display:flex;gap:7px;margin-left:auto}.action-btn.save{background:#fff;color:#07132f;font-weight:800}.card{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.2)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:13px;margin:0 0 7px}.field.input label{color:var(--red);font-weight:700}.input-wrap{position:relative}.field input,.field select{width:100%;border:1px solid rgba(255,255,255,.2);border-radius:13px;background:rgba(2,8,25,.78);color:#fff;padding:13px 14px;outline:none}.input-wrap input{padding-right:72px}.input-unit{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#cbd4e8;font-weight:700;pointer-events:none}.field input:focus,.field select:focus{border-color:var(--red)}.result{margin-top:16px;padding:17px;border-radius:16px;background:#fff;color:#07132f}.result small{display:block;color:#53617c;margin-bottom:6px}.result strong{font-size:24px;overflow-wrap:anywhere}.result.secondary strong{font-size:18px}.note{font-size:12px;color:var(--muted);margin:14px 2px 0}.note.warning{font-size:16px;color:var(--red);font-weight:800;padding:12px 14px;border:1px solid rgba(255,102,120,.45);border-radius:12px;background:rgba(255,102,120,.08)}.set-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px}.set-results .result{margin:0}.timepick{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.clock{font-variant-numeric:tabular-nums;font-size:23px;font-weight:800;padding:12px 0;color:var(--good)}
    dialog{width:min(680px,calc(100% - 28px));max-height:82vh;border:1px solid var(--line);border-radius:20px;background:#091633;color:#fff;padding:0;box-shadow:0 24px 70px rgba(0,0,0,.55)}dialog::backdrop{background:rgba(0,0,0,.7)}.history-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:17px 18px;background:#091633;border-bottom:1px solid var(--line)}.history-head h3{margin:0}.history-list{padding:14px;overflow:auto}.history-item{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:10px}.history-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.history-item h4{margin:0 0 4px}.history-item time{font-size:11px;color:var(--muted)}.history-delete{border:1px solid #ff6171;background:rgba(255,73,91,.12);color:#ff7885;border-radius:9px;padding:7px 11px;font-weight:800;cursor:pointer}.history-line{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding-top:7px;border-top:1px solid rgba(255,255,255,.08);margin-top:7px}.history-line b{text-align:right}.empty-history{text-align:center;color:var(--muted);padding:40px 10px}
    .calc-display{width:100%;height:74px;text-align:right;font-size:30px;border:1px solid var(--line);border-radius:15px;background:#020819;color:#fff;padding:14px;margin-bottom:12px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.keys button{height:58px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font-size:18px}.keys .op{color:var(--red)}.keys .eq{background:#fff;color:#07132f;font-weight:800}.wide{grid-column:span 2}
    @media(max-width:560px){.shell{padding:15px 14px 34px}.brand img{width:56px;height:56px}.grid{grid-template-columns:1fr}.card{padding:16px}.menu{grid-template-columns:1fr 1fr}.menu button{min-height:105px;padding:14px}.menu b{font-size:15px}.topbar{gap:7px}.topbar h2{font-size:17px}.back,.action-btn{padding:9px 10px;font-size:13px}}
  </style>
</head>
<body><main class="shell">
  <header class="brand"><img src="./assets/app-icon.png" alt="어브코스 계산기 마크"><div><h1>Production Calculator</h1><p>입력은 빨간색 · 계산 결과는 검은색</p></div></header>
  <section id="home" class="page active"><h2 class="home-title">계산기를 선택하세요</h2><p class="hint">필요한 계산기만 열어서 간편하게 사용하세요.</p><div class="menu" id="menu"></div></section>
  <section id="tool" class="page"><div class="topbar"><button class="back" onclick="goHome()">← 메인</button><h2 id="toolTitle"></h2><div class="top-actions"><button class="action-btn" onclick="openHistory()">기록</button><button id="saveBtn" class="action-btn save" onclick="saveCurrent()">저장</button></div></div><div id="toolBody"></div></section>
  <dialog id="historyDialog"><div class="history-head"><h3>저장 기록</h3><button class="action-btn" onclick="historyDialog.close()">닫기</button></div><div id="historyList" class="history-list"></div></dialog>
</main>
<script>
const tools=[
 ['yield','1. 수율 계산','인계·환입 벌크 대비 수율'],['bulk','2. 벌크 수량 계산','벌크로 생산 가능한 수량'],['set','3. SET 포장 수량','구성품별 필요 수량'],['defect','4. 불량률 계산','생산수량 대비 불량률'],['density','5. 비중 계산','ml와 비중으로 제품무게'],['productivity','5. 생산성 계산','목표 대비 현재 생산성'],['time','6. 생산시간 계산','고정 기준시간으로 완료시각 계산'],['pt','7. 파렛트 계산','파렛트·박스·낱개 분리'],['normal','일반 계산기','사칙연산 계산기']
];
const menu=document.querySelector('#menu'); tools.forEach(([id,n,d])=>menu.insertAdjacentHTML('beforeend',`<button onclick="openTool('${id}')"><b>${n}</b><span>${d}</span></button>`));
const n=(v)=>Number(v)||0, fmt=(v,d=0)=>Number.isFinite(v)?v.toLocaleString('ko-KR',{maximumFractionDigits:d}):'-';
const field=(id,label,value='',step='any',extra='')=>{const match=label.match(/\((kg|g|ml|ea|ea\/분|BOX|분)\)\s*$/i),unit=match?match[1]:'';return `<div class="field input"><label for="${id}">${label}</label><div class="input-wrap"><input id="${id}" type="number" inputmode="decimal" value="${value}" step="${step}" ${extra}>${unit?`<span class="input-unit">${unit}</span>`:''}</div></div>`};
const out=(label,id)=>`<div class="result"><small>${label}</small><strong id="${id}">-</strong></div>`;
function show(title,html,calc){document.querySelector('#home').classList.remove('active');document.querySelector('#tool').classList.add('active');toolTitle.textContent=title;toolBody.innerHTML=`<div class="card">${html}</div>`;toolBody.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));calc()}
let currentToolId='';
function displayHome(){document.querySelector('#tool').classList.remove('active');document.querySelector('#home').classList.add('active');currentToolId=''}
function goHome(fromNative=false){if(!fromNative&&history.state?.tool){history.back()}else{displayHome()}}
function openTool(id){
 currentToolId=id;if(!history.state?.tool)history.pushState({tool:id},'',`#${id}`);
 const t=tools.find(x=>x[0]===id)[1];
 if(id==='yield')show(t,`<div class="grid">${field('handover','인계 벌크 (kg)',1050)}${field('returned','환입 벌크 (kg)',0)}${field('count','제품 개수 (ea)',6350,1)}${field('weight','제품 무게 / 1개 (g)',160)}</div>${out('벌크 loss','r1')}${out('수율','r3')}`,()=>{const usedBulk=n(handover.value)-n(returned.value),productKg=n(count.value)*n(weight.value)/1000,loss=usedBulk-productKg;r1.textContent=fmt(loss,3)+' kg';r3.textContent=usedBulk?fmt(productKg/usedBulk*100,2)+' %':'-'});
 if(id==='bulk')show(t,`<div class="grid">${field('bulkW','벌크 무게 (kg)',1050)}${field('unitW','1개 제품무게 (g)',160)}</div>${out('생산가능 수량','r1')}`,()=>r1.textContent=n(unitW.value)?fmt(n(bulkW.value)/n(unitW.value)*1000,2)+' ea':'-');
 if(id==='set')show(t,`<div class="grid">${field('orders','생산 수주 수량 (ea)',10000,1)}${field('mainIn','본품 투입수량 (ea)',1)}${field('sub1','미품 1 투입수량 (ea)',1)}${field('sub2','미품 2 투입수량 (ea)',2)}${field('sub3','미품 3 투입수량 (ea)',1)}${field('sub4','미품 4 투입수량 (ea)',1)}</div><div class="set-results">${out('본품 필요수량','s0')}${out('미품 1 필요수량','s1')}${out('미품 2 필요수량','s2')}${out('미품 3 필요수량','s3')}${out('미품 4 필요수량','s4')}</div>`,()=>[mainIn,sub1,sub2,sub3,sub4].forEach((x,i)=>document.querySelector('#s'+i).textContent=n(x.value)?fmt(n(orders.value)/n(x.value),2)+' ea':'-'));
 if(id==='defect')show(t,`<div class="grid">${field('prod','생산수량 (ea)',5000,1)}${field('bad','불량수량 (ea)',500,1)}</div>${out('불량률','r1')}`,()=>r1.textContent=n(prod.value)?fmt(n(bad.value)/n(prod.value)*100,2)+' %':'-');
 if(id==='density')show(t,`<div class="grid">${field('den','비중',1.072)}${field('ml','제품 표기 용량 (ml)',150)}</div>${out('제품무게','r1')}<p class="note warning">※ 제품 표기가 g인 경우에는 비중 계산을 적용하지 않습니다.</p>`,()=>r1.textContent=fmt(n(den.value)*n(ml.value),3)+' g');
 if(id==='productivity')show(t,`<div class="grid">${field('mins','근무시간 (분)',150,1)}${field('capa','셋팅 CAPA (ea/분)',18)}${field('currentQty','현재 나온 수량 (ea)',2300,1)}</div>${out('셋팅수량','r1')}${out('차이량','r2')}${out('생산성','r3')}`,()=>{let target=n(mins.value)*n(capa.value),actual=n(currentQty.value);r1.textContent=fmt(target)+' ea';r2.textContent=fmt(actual-target)+' ea';r3.textContent=target?fmt(actual/target*100,2)+' %':'-'});
 if(id==='time')timeTool(t);
 if(id==='pt')show(t,`<div class="grid">${field('qty','생산수량 (ea)',10000,1)}${field('innerEa','인박스 내입수 (ea)',4,1,'min="1"')}${field('outerEa','아웃박스 내입수 (ea)',20,1,'min="1"')}${field('ptOuter','1파렛트 아웃박스 수량 (BOX)',40,1,'min="1"')}</div>${out('필요 인박스','r1')}${out('필요 아웃박스','r2')}<div class="result secondary"><small>파렛트 계산 결과</small><strong id="r3">-</strong></div><p class="note">완성 파렛트와 잔량을 아웃박스·낱개 단위로 자동 분리합니다.</p>`,calcPt);
 if(id==='normal')normalCalc(t);
}
window.addEventListener('popstate',displayHome);
function saveCurrent(){
 const fields=[...document.querySelectorAll('#toolBody .field.input')].map(box=>{const label=box.querySelector('label')?.textContent?.trim()||'';const controls=[...box.querySelectorAll('input,select')];let value=controls.map(x=>x.value.padStart?.(2,'0')||x.value).join(controls.length>1?':':'');const unit=box.querySelector('.input-unit')?.textContent||'';return {label,value:value+(unit?' '+unit:'')}});
 const results=[...document.querySelectorAll('#toolBody .result')].map(box=>({label:box.querySelector('small')?.textContent?.trim()||'결과',value:box.querySelector('strong')?.textContent?.trim()||''}));
 const display=document.querySelector('#display');if(display)results.push({label:'계산 결과',value:display.value});
 const records=JSON.parse(localStorage.getItem('productionCalcHistory')||'[]');records.unshift({id:Date.now(),tool:toolTitle.textContent,time:new Date().toLocaleString('ko-KR'),fields,results});localStorage.setItem('productionCalcHistory',JSON.stringify(records.slice(0,20)));
 const btn=document.querySelector('#saveBtn');btn.textContent='저장됨 ✓';setTimeout(()=>btn.textContent='저장',1200);
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openHistory(){renderHistory();historyDialog.showModal()}
function renderHistory(){const records=JSON.parse(localStorage.getItem('productionCalcHistory')||'[]');historyList.innerHTML=records.length?records.map(record=>`<article class="history-item"><div class="history-item-head"><div><h4>${esc(record.tool)}</h4><time>${esc(record.time)}</time></div><button class="history-delete" onclick="deleteHistory(${Number(record.id)})">삭제</button></div>${record.fields.map(x=>`<div class="history-line"><span>${esc(x.label)}</span><b>${esc(x.value)}</b></div>`).join('')}${record.results.map(x=>`<div class="history-line"><span>${esc(x.label)}</span><b>${esc(x.value)}</b></div>`).join('')}</article>`).join(''):'<div class="empty-history">아직 저장된 기록이 없습니다.<br>계산 후 오른쪽 위 저장을 눌러주세요.</div>'}
function deleteHistory(id){const records=JSON.parse(localStorage.getItem('productionCalcHistory')||'[]').filter(record=>Number(record.id)!==Number(id));localStorage.setItem('productionCalcHistory',JSON.stringify(records));renderHistory()}
function calcPt(){const q=Math.max(0,Math.ceil(n(qty.value))),ie=Math.max(1,Math.floor(n(innerEa.value))),oe=Math.max(1,Math.floor(n(outerEa.value))),po=Math.max(1,Math.floor(n(ptOuter.value)));const totalInner=Math.ceil(q/ie),totalOuter=Math.ceil(q/oe),perPtEa=oe*po,fullPt=Math.floor(q/perPtEa),remEa=q%perPtEa,remOuter=Math.floor(remEa/oe),looseEa=remEa%oe,totalPt=fullPt+(remEa?1:0);r1.textContent=fmt(totalInner)+' BOX';r2.textContent=fmt(totalOuter)+' BOX';let detail=`${fmt(fullPt)}파렛트`;if(remEa){detail+=` + 1파렛트 (`;const parts=[];if(remOuter)parts.push(`${remOuter} BOX`);if(looseEa)parts.push(`${looseEa} ea`);detail+=parts.join(' + ')+')'}detail+=` = 총 ${fmt(totalPt)}파렛트`;r3.textContent=detail}
function timeTool(title){const opts=(max)=>Array.from({length:max},(_,i)=>`<option value="${i}">${String(i).padStart(2,'0')}</option>`).join('');window.timeBase=new Date();show(title,`<div class="field"><label>기준시간 (메뉴를 연 시각)</label><div class="clock" id="liveClock"></div></div><div class="grid"><div class="field input"><label>근무종료시간</label><div class="timepick"><select id="endH">${opts(24)}</select><b>:</b><select id="endM">${opts(60)}</select></div></div>${field('breakM','쉬는시간 (분)',0,1,'min="0"')}${field('timeCapa','생산 CAPA (ea/분)',18)}${field('nowQty','현재수량 (ea)',2300,1,'min="0"')}${field('goalQty','목표 생산수량 (ea)',10000,1,'min="0"')}</div>${out('남은 실제 생산시간','r1')}${out('근무종료 시 예상 총수량','r2')}<div class="result secondary"><small>목표수량 예상 완료</small><strong id="r4">-</strong></div><p class="note">기준시간은 이 계산기 메뉴를 다시 열기 전까지 흐르지 않습니다.</p>`,calcTime);const end=new Date(window.timeBase.getTime()+8*3600000);endH.value=end.getHours();endM.value=end.getMinutes();calcTime()}
function calcTime(){const base=window.timeBase||new Date();liveClock.textContent=base.toLocaleTimeString('ko-KR',{hour12:false});let end=new Date(base);end.setHours(n(endH.value),n(endM.value),0,0);if(end<=base)end.setDate(end.getDate()+1);const breakMinutes=Math.max(0,n(breakM.value)),gross=Math.max(0,Math.floor((end-base)/60000)),net=Math.max(0,gross-breakMinutes),capa=Math.max(0,n(timeCapa.value)),current=Math.max(0,n(nowQty.value)),goal=Math.max(0,n(goalQty.value)),need=Math.max(0,goal-current),workMinutes=capa?Math.ceil(need/capa):Infinity,finish=new Date(base.getTime()+(breakMinutes+workMinutes)*60000),expectedAtEnd=Math.min(current+net*capa,goal);r1.textContent=fmt(net)+' 분';r2.textContent=fmt(expectedAtEnd)+' ea';if(!Number.isFinite(workMinutes)){r4.textContent='CAPA를 입력하세요'}else{const finishTime=finish.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});if(finish<=end){r4.textContent=`${finishTime} · 근무시간 내 완료 가능`}else{const over=Math.ceil((finish-end)/60000),hours=Math.floor(over/60),minutes=over%60;r4.textContent=`${finishTime} · 근무 종료 후 ${hours?hours+'시간 ':''}${minutes?minutes+'분 ':''}추가 필요`}}}
function normalCalc(title){show(title,`<input class="calc-display" id="display" value="0" readonly><div class="keys"><button onclick="cc()">C</button><button onclick="press('(')">(</button><button onclick="press(')')">)</button><button class="op" onclick="press('/')">÷</button>${['7','8','9','*','4','5','6','-','1','2','3','+'].map(x=>`<button class="${'+-*/'.includes(x)?'op':''}" onclick="press('${x}')">${x==='*'?'×':x}</button>`).join('')}<button class="wide" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="eq" onclick="equals()">=</button></div>`,()=>{});window.expr=''}
function press(x){window.expr=(window.expr||'')+x;display.value=window.expr}function cc(){window.expr='';display.value='0'}function equals(){try{if(!/^[0-9+\-*/(). ]+$/.test(window.expr))throw 0;const v=Function('"use strict";return ('+window.expr+')')();display.value=Number.isFinite(v)?v:'오류';window.expr=String(v)}catch{display.value='오류';window.expr=''}}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
